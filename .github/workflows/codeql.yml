name: CodeQL

# Static analysis (SAST) on every PR and on main, per the ISMS SDLC
# policy requirement that SAST and SCA run before merge (SCA is the
# bundle-audit job in ci.yml).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 18 * * 1" # weekly, Tuesday 04:30 AEST

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ruby
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
