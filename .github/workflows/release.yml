name: Release

# Publishes to RubyGems.org when a GitHub release is published.
#
# Authentication uses RubyGems trusted publishing (OIDC); do not add an API
# key secret. One-time setup after Verifiabl/verifiabl-ruby exists:
#   1. RubyGems.org → verifiabl-issuer → Trusted publishers → GitHub Actions.
#   2. Set owner Verifiabl, repository verifiabl-ruby, workflow release.yml,
#      and environment rubygems-publish.
#   3. In GitHub create the rubygems-publish environment, restrict deployment
#      to protected issuer/v* tags, and require a Verifiabl release reviewer.
# The publish job attests the inspected gem before requesting credentials, and
# verify-registry checks the gem RubyGems.org serves against that attestation.
# If verify-registry fails, the release is incomplete: rerun only that job.
# If publication fails before RubyGems accepts the gem, rerun the job. If the
# version exists, never move/delete its tags or overwrite it; prepare a new
# patch version through the private release workflow.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rubygems-publish
    outputs:
      rubygems_version: ${{ steps.rubygems.outputs.RUBYGEMS_VERSION }}
    permissions:
      contents: read
      id-token: write # OIDC token for RubyGems trusted publishing and build provenance
      attestations: write # Sigstore build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Validate the release target and tag checkout
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/release-tool.mjs validate-checkout "$TAG"
      - run: bundle exec rake
      - run: mkdir artifacts
      - name: Map the SemVer release to its RubyGems version
        id: rubygems
        run: ruby -rrubygems -e 'version = Gem::Version.new(ENV.fetch("VERSION")).to_s; [ENV.fetch("GITHUB_ENV"), ENV.fetch("GITHUB_OUTPUT")].each { |path| File.open(path, "a") { |file| file.puts("RUBYGEMS_VERSION=#{version}") } }'
      - name: Build the configured gem
        run: node .github/scripts/release-tool.mjs pack "$RELEASE_TARGET_ID" "$VERSION"
      - name: Inspect and consume the packed gem
        run: |
          ruby -rrubygems/package -e 'path = Dir["artifacts/*.gem"].fetch(0); spec = Gem::Package.new(path).spec; abort "wrong gem name" unless spec.name == "verifiabl-issuer"; abort "wrong gem version" unless spec.version.to_s == ENV.fetch("RUBYGEMS_VERSION"); abort "empty gem" if spec.files.empty?'
          bundle exec ruby script/packed_gem_check.rb "artifacts/verifiabl-issuer-${VERSION}.gem"
      - name: Verify tracked release sources are clean
        run: node .github/scripts/release-tool.mjs verify-clean
      # Attest the exact inspected bytes before any publishing credential exists,
      # so a failed attestation blocks publication.
      - name: Attest build provenance for the inspected gem
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/verifiabl-issuer-${{ env.VERSION }}.gem
      # Mint OIDC credentials only after validation, tests, build, inspection,
      # the isolated packed-gem consumer check, and attestation have completed.
      - name: Configure RubyGems trusted-publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish the already-inspected gem
        run: gem push "artifacts/verifiabl-issuer-${VERSION}.gem"

  # Proves the gem RubyGems.org serves is the attested build, using the same
  # command consumers run. It holds no publishing credential, so rerunning
  # only this failed job never pushes again.
  verify-registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: read
    env:
      GEM_FILE: verifiabl-issuer-${{ needs.publish.outputs.rubygems_version }}.gem
    steps:
      - name: Download the published gem from RubyGems.org
        run: |
          set -euo pipefail
          for attempt in $(seq 1 100); do
            if curl -fsSLo "$GEM_FILE" "https://rubygems.org/downloads/$GEM_FILE"; then
              exit 0
            fi
            echo "Attempt $attempt: $GEM_FILE is not available yet"
            sleep 30
          done
          echo "::error::$GEM_FILE was not available from RubyGems.org; rerun this job once it is"
          exit 1
      - name: Verify the published gem against this release's provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "$GEM_FILE"
          --repo Verifiabl/verifiabl-ruby
          --signer-workflow Verifiabl/verifiabl-ruby/.github/workflows/release.yml
          --source-ref "$GITHUB_REF"
          --source-digest "$GITHUB_SHA"
          --deny-self-hosted-runners
