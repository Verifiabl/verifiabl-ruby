name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "3.5", "4.0"]
    # Token store integration tests share tokens between forked processes
    # through Redis. The image is pinned by digest, like the actions.
    services:
      redis:
        image: redis:8.8.3-alpine@sha256:f61bc3826f4a37a6ba8ca50ee75e3525709b01779d8e468233e6d238119aed72
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rake
      - run: bundle exec gem build verifiabl-issuer.gemspec
        working-directory: gems/verifiabl-issuer
      - run: bundle exec ruby script/packed_gem_check.rb
      - name: Validate basic example
        run: ruby script/basic_example_check.rb

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      # Runtime and development gems use the same advisory policy because test,
      # lint, and build dependencies execute in trusted CI and release jobs.
      - run: bundle exec bundle-audit check --update
      - run: bundle exec bundle-audit check --gemfile-lock examples/issuer/basic/Gemfile.lock
